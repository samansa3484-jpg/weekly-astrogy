name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Check astronomical calculations
        run: |
          node --experimental-strip-types scripts/aspects.test.mjs
          node --experimental-strip-types scripts/houses.test.mjs
          node --experimental-strip-types scripts/events.test.mjs
          node --experimental-strip-types scripts/daily-guidance.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Preview and capture
        run: |
          mkdir -p artifacts
          (npm run preview -- --host 127.0.0.1 > /tmp/weekly-preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/verify.mjs
      - name: Upload visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-astrology-visual-check
          path: artifacts/
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: weekly-astrology-dist
          path: dist/
